<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" fill="#ffffff" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .mono { font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    </style>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="798" height="398" x="1" y="1" fill="#0d0e16" rx="24" />
  <rect width="798" height="398" x="1" y="1" fill="url(#aurora)" rx="24" />
  <rect width="798" height="398" x="1" y="1" fill="url(#dots)" rx="24" />
  <rect width="798" height="398" x="1" y="1" fill="none" stroke="url(#borderGrad)" stroke-width="1" rx="24" />

  <g transform="translate(40, 60)">
    <rect width="130" height="28" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-width="1" rx="14" />
    <circle cx="16" cy="14" r="4" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="19" font-size="12" fill="#22d3ee" font-weight="bold">Open to collabs</text>
    <text x="0" y="70" font-size="20" opacity="0.8">Hi there, I'm</text>
    <text x="0" y="115" font-size="42" font-weight="900" fill="url(#textGrad)">Gopal Krishna Jha</text>

    <g transform="translate(0, 150)" font-size="18" fill="#a78bfa">
      <text opacity="0">Software Engineer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.28;0.33;1" dur="9s" repeatCount="indefinite" />
      </text>
      <text opacity="0">Java Full-Stack Developer
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.61;0.66;1" dur="9s" repeatCount="indefinite" />
      </text>
      <text opacity="0">Cloud &amp; AI Enthusiast
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.94;1" dur="9s" repeatCount="indefinite" />
      </text>
    </g>

    <g transform="translate(0, 220)" font-size="14" opacity="0.8">
      <circle cx="10" cy="-4" r="3" fill="#22d3ee" />
      <text x="22" y="0">Bengaluru</text>
    </g>
  </g>

  <g transform="translate(420, 30)">
    <rect width="340" height="340" x="0" y="0" rx="12" fill="#0f111a" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
    <circle cx="20" cy="20" r="6" fill="#ef4444" />
    <circle cx="40" cy="20" r="6" fill="#eab308" />
    <circle cx="60" cy="20" r="6" fill="#22c55e" />
    <text x="100" y="24" class="mono" font-size="12" fill="#8b949e">~/workspace/Developer.java</text>
    <line x1="0" y1="40" x2="340" y2="40" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />

    <g transform="translate(20, 75)" class="mono" font-size="13" fill="#e5e7eb">
      <text y="0" fill="#a78bfa">@RestController</text>
      <text y="22" fill="#a78bfa">@RequestMapping</text>
      <text y="44"><tspan fill="#f472b6">public class</tspan> <tspan fill="#22d3ee">Developer</tspan> {</text>
      <text y="82" x="20" fill="#a78bfa">@Autowired</text>
      <text y="104" x="20"><tspan fill="#f472b6">private</tspan> <tspan fill="#22d3ee">CloudService</tspan> awsAndAzure;</text>
      <text y="142" x="20" fill="#a78bfa">@GetMapping</text>
      <text y="164" x="20"><tspan fill="#f472b6">public</tspan> List&lt;String&gt; getStack() {</text>
      <text y="186" x="40"><tspan fill="#f472b6">return</tspan> List.of(</text>
      <text y="208" x="60" fill="#a3e635">"Java", "Spring Boot",</text>
      <text y="230" x="60" fill="#a3e635">"PostgreSQL", "GenAI"</text>
      <text y="252" x="40">);</text>
      <text y="274" x="20">}</text>
      <text y="296">}</text>
      <rect x="15" y="284" width="8" height="15" fill="#22d3ee">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
