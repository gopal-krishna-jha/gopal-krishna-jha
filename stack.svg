<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .glass-bg { fill: #0d0e16; }
      .orbit-path { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 1; stroke-dasharray: 4 4; }
    </style>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="coreGlow">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="798" height="398" x="1" y="1" rx="24" class="glass-bg"/>
  <rect width="798" height="398" x="1" y="1" rx="24" fill="url(#aurora)"/>
  <rect width="798" height="398" x="1" y="1" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="1"/>

  <g transform="translate(0, 0)">
    <ellipse cx="250" cy="200" rx="140" ry="60" class="orbit-path" transform="rotate(-15 250 200)"/>
    <ellipse cx="250" cy="200" rx="190" ry="80" class="orbit-path" transform="rotate(15 250 200)"/>
    <ellipse cx="250" cy="200" rx="240" ry="100" class="orbit-path" transform="rotate(-5 250 200)"/>

    <circle cx="250" cy="200" r="40" fill="url(#coreGlow)">
      <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="200" r="20" fill="#0d0e16" stroke="#22d3ee" stroke-width="2"/>
    <text x="250" y="205" font-size="12" text-anchor="middle" font-weight="bold" fill="#22d3ee">DB</text>

    <g transform="translate(250,200) rotate(-15)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
        <g transform="translate(140, 0) rotate(15)">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite" additive="sum"/>
          <circle cx="0" cy="0" r="16" fill="#0f111a" stroke="#f472b6" stroke-width="2"/>
          <text x="0" y="4" font-size="10" text-anchor="middle">Java</text>
        </g>
      </g>
    </g>

    <g transform="translate(250,200) rotate(15)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
        <g transform="translate(190, 0) rotate(-15)">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="18s" repeatCount="indefinite" additive="sum"/>
          <g>
             <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
             <circle cx="35" cy="0" r="6" fill="#a78bfa"/>
             <circle cx="-35" cy="0" r="6" fill="#22d3ee"/>
          </g>
          <circle cx="0" cy="0" r="20" fill="#0f111a" stroke="#22c55e" stroke-width="2"/>
          <text x="0" y="4" font-size="10" text-anchor="middle">Spring</text>
        </g>
      </g>
    </g>

    <g transform="translate(250,200) rotate(-5)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        <g transform="translate(240, 0) rotate(5)">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite" additive="sum"/>
          <circle cx="0" cy="0" r="18" fill="#0f111a" stroke="#eab308" stroke-width="2"/>
          <text x="0" y="4" font-size="10" text-anchor="middle">AWS</text>
        </g>
        <g transform="translate(-240, 0) rotate(5)">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite" additive="sum"/>
          <circle cx="0" cy="0" r="18" fill="#0f111a" stroke="#22d3ee" stroke-width="2"/>
          <text x="0" y="4" font-size="10" text-anchor="middle">AI</text>
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(540, 60)">
    <text x="0" y="0" font-size="18" font-weight="bold" fill="#a78bfa">Technical Focus</text>
    
    <text x="0" y="30" font-size="12" fill="#8b949e" font-weight="bold">BACKEND</text>
    <rect x="0" y="40" width="80" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="#f472b6"/>
    <text x="40" y="58" font-size="12" text-anchor="middle">Java</text>
    <rect x="90" y="40" width="100" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="#22c55e"/>
    <text x="140" y="58" font-size="12" text-anchor="middle">Spring Boot</text>

    <text x="0" y="100" font-size="12" fill="#8b949e" font-weight="bold">CLOUD &amp; DEVOPS</text>
    <rect x="0" y="110" width="70" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="#eab308"/>
    <text x="35" y="128" font-size="12" text-anchor="middle">AWS</text>
    <rect x="80" y="110" width="80" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="#3b82f6"/>
    <text x="120" y="128" font-size="12" text-anchor="middle">Azure</text>

    <text x="0" y="170" font-size="12" fill="#8b949e" font-weight="bold">DATA</text>
    <rect x="0" y="180" width="100" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="#22d3ee"/>
    <text x="50" y="198" font-size="12" text-anchor="middle">PostgreSQL</text>

    <text x="0" y="240" font-size="12" fill="#8b949e" font-weight="bold">GENERATIVE AI</text>
    <rect x="0" y="250" width="60" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="#a78bfa"/>
    <text x="30" y="268" font-size="12" text-anchor="middle">LLMs</text>
    <rect x="70" y="250" width="60" height="28" rx="14" fill="rgba(255,255,255,0.05)" stroke="#a78bfa"/>
    <text x="100" y="268" font-size="12" text-anchor="middle">RAG</text>
  </g>
</svg>